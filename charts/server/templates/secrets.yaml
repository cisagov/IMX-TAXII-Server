{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: taxii-server-secrets
type: Opaque
stringData:
  A1_PASS: {{ .Values.secrets.a1Password | quote }}
  ELASTIC_PASSWORD: {{ .Values.secrets.elasticPassword | quote }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  KIBANA_PASSWORD: {{ .Values.secrets.kibanaPassword | quote }}
  OPENSEARCH_PASSWORD: {{ .Values.secrets.opensearchPassword | quote }}
  TAXII_PASSWORD: {{ .Values.secrets.taxiiPassword | quote }}
{{- end}}
