---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.server.name }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 3 }}
  strategy:
    type: Recreate
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.server.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.server.app }}
    spec:
      securityContext:
        {{- toYaml .Values.server.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: target
          emptyDir:
            sizeLimit: 512Mi
        - name: schema
          persistentVolumeClaim:
            claimName: schema
      containers:
        - name: {{ .Values.server.name }}
          securityContext:
            {{- toYaml .Values.server.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          image: "{{ .Values.server.image}}:{{ .Values.server.tag }}"
          imagePullPolicy: "{{ .Values.server.imagePullPolicy }}"
          volumeMounts:
            - name: target
              mountPath: /target
            - name: schema
              mountPath: /opt/schema
          args:
            - '--root'
            - cti-stix-common-objects/root-collections.json
            - '--mirror'
            - cti-stix-common-objects/essentials.json
            - "--root"
            - "oca-iob/root-collections.json"
            - "--mirror"
            - "oca-iob/essentials.json"
            - "--mirror"
            - "oca-iob/schemas.json"
            - "--root"
            - "mitre-attack/root-collections.json"
            - "--mirror"
            - "mitre-attack/essentials.json"
            - "--root"
            - "malware-behavior-catalog/root-collections.json"
            - "--mirror"
            - "malware-behavior-catalog/essentials.json"
            - '--schema'
            - infos/cti-stix-common-objects.json
            - '--schema'
            - infos/oca-iob.json

          env:
            - name: A1_HOST
              value: {{ .Values.server.a1Host | quote }}

            - name: A1_USER
              value: {{ .Values.server.a1User | quote }}

            - name: A1_PASS
              valueFrom:
                secretKeyRef:
                  name: taxii-server-secrets
                  key: A1_PASS

            - name: OPENSEARCH_URL
              value: {{ .Values.opensearch.url | quote }}

            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taxii-server-secrets
                  key: OPENSEARCH_PASSWORD

            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: taxii-server-secrets
                  key: GITHUB_TOKEN

            - name: SCHEMA_DIR
              value: {{ .Values.server.schemaDir | quote }}

            - name: TAXII_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taxii-server-secrets
                  key: TAXII_PASSWORD

            - name: TAXII_EXPOSED_PORT
              value: {{ .Values.server.targetPort | quote }}

            - name: TAXII_PORT
              value: {{ .Values.server.port | quote }}

            - name: VALID_ISSUERS
              value: {{ .Values.server.validIssuers | toJson | quote }}

            - name: TAXII_URL
              value: {{ .Values.server.url | quote }}

            - name: TAXII_XUUID
              value: {{ .Values.server.uuid | quote }}

            - name: VALIDATOR_URL
              value: {{ .Values.validator.url | quote }}

          ports:
            - containerPort: {{ .Values.server.port }}

        - name: {{ .Values.validator.name }}
          securityContext:
            {{- toYaml .Values.validator.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.validator.resources | nindent 12 }}
          image: "{{ .Values.validator.image}}:{{ .Values.validator.tag }}"
          imagePullPolicy: "{{ .Values.validator.imagePullPolicy }}"
          ports:
            - containerPort: {{ .Values.validator.port }}
          volumeMounts:
            - name: schema
              mountPath: /opt/schema

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.server.name }}
  labels:
    app: {{ .Values.server.app }}
spec:
  type: {{ .Values.server.type }}
  ports:
   - port: {{ .Values.server.port }}
     targetPort: {{ .Values.server.targetPort }}
  selector:
   app: {{ .Values.server.app }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: taxii-server-route
spec:
  path: /
  to:
    name: {{ .Values.server.name }}
    weight: 100
    kind: Service
  host: {{ .Values.ingress.host }}
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  port:
    targetPort: {{ .Values.server.targetPort }}
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: schema
  labels:
    app: {{ .Values.server.app }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---