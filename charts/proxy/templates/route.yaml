apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: taxii-proxy-route
spec:
  path: /
  to:
    name: {{ .Values.name }}
    weight: 100
    kind: Service
  host: {{ .Values.ingress.host }}
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  port:
    targetPort: {{ .Values.service.targetPort }}
