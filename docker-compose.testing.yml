name: test-taxii
services:

  opensearch:
    container_name: test-opensearch-taxii
    image: opensearchproject/opensearch:3.7.0
    restart: unless-stopped
    mem_limit: 2g
    networks:
      - test-taxii-server
    environment:
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - discovery.type=single-node
      - path.repo=/opt/snapshots
      - plugins.security.disabled=true
    volumes:
      - test-taxii-data:/usr/share/opensearch/data
      - ./snapshots:/opt/snapshots
    healthcheck:
      test: ["CMD", "curl", "--user", "admin:${OPENSEARCH_PASSWORD}", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 20

  stix2-validator:
    container_name: test-stix2-validator
    build:
      context: ./stix2-validator
      dockerfile: Dockerfile
    restart: always
    env_file: .env.testing
    networks:
      - test-taxii-server
    volumes:
      - test-schema:${SCHEMA_DIR}

  server:
    container_name: test-taxii-server
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      opensearch:
        condition: service_healthy
    env_file: .env.testing
    networks:
      - test-taxii-server
    volumes:
      - test-gitrepos:/opt/repos
      - test-taxiiIO:/opt/io
      - ./tests/bootstrap:/opt/bootstrap:ro
      - test-schema:${SCHEMA_DIR}
      - ./keystore:/opt/keystore:ro
    ports:
      - "${TAXII_EXPOSED_PORT}:${TAXII_PORT}"
    command:
      - "--root"
      - "/opt/bootstrap/test-bootstrap.json"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tester:
    container_name: test-taxii
    image: ghcr.io/astral-sh/uv:0.11.27-python3.12-alpine
    depends_on:
      server:
        condition: service_started
    env_file: .env.testing
    networks:
      - test-taxii-server
    volumes:
      - .:/app
    working_dir: /app
    command: uv run pytest

volumes:
  test-taxii-data:
    driver: local
  test-schema:
    driver: local
  test-gitrepos:
    driver: local
  test-taxiiIO:
    driver: local

networks:
  test-taxii-server:
    name: test-taxii-server
