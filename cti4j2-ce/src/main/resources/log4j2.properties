# Root Logger
rootLogger=DEBUG, STDOUT, LOGFILE

# Direct log messages to STDOUT
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n

# Direct to a file
appender.file.type = File
appender.file.append = false
appender.file.name = LOGFILE
appender.file.fileName = target/logs/log4j2.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n
appender.file.filter.threshold.type = ThresholdFilter
appender.file.filter.threshold.level = debug

# Set level to info for some verbose packages
logger.auth.name = com.cisa.taxii4j2.auth
logger.auth.level = INFO
logger.security.name = com.cisa.taxii4j2.servlet.security
logger.security.level = INFO
logger.opensearch.name = org.opensearch
logger.opensearch.level = INFO
