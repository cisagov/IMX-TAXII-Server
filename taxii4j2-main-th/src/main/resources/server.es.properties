bindSpecs.file = bindSpecs.json

#
# TAXII paths
#

# TAXII server
hosts.taxii = taxii/v2.1-os/
# Admin server
hosts.admin = admin/v1.0/
# Search server
hosts.search = ext/v1.0/
# Schema repo server
hosts.schemaRepo = ext/v1.0/schema/

dirs.SCHEMA_DIR = /opt/schema
dirs.BOOTSTRAP_DIR = /opt/bootstrap
#
# Basic TAXII configuration
#

# maximum number of objects returned (by manifest and objects endpoints)
taxii.limitMax = 1024
# all but API root portion of value returned by taxii2 endpoint
taxii.discovery = { \
	"title": "taxii4j2/Thu Sep 12 08:21:00 AM EDT 2024", \
	"description": "Fully TAXII 2.1- / Interoperability-compliant server by CISA" \
}
